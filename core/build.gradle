[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

def generatedVersionDir = file("$buildDir/generated/sources/version")
def generatedVersionFile = new File(generatedVersionDir, 'bms/player/beatoraja/Version.java')

task generateVersion {
    inputs.property 'projectVersion', projectVersion
    outputs.file generatedVersionFile
    doLast {
        generatedVersionFile.parentFile.mkdirs()
        generatedVersionFile.text = """package bms.player.beatoraja;

public final class Version {
    public static final String VALUE = "${projectVersion}";
}
"""
    }
}

sourceSets.main.java.srcDirs += generatedVersionDir
compileJava.dependsOn generateVersion

dependencies {
  // beatoraja 核心 JSON 工具
  implementation "com.fasterxml.jackson.core:jackson-databind:2.22.0"

  // 常用工具类
  implementation "org.apache.commons:commons-lang3:3.20.0"
  implementation "commons-io:commons-io:2.22.0"
  implementation "commons-dbutils:commons-dbutils:1.8.1"
  implementation "org.apache.commons:commons-compress:1.28.0"

  implementation "commons-dbutils:commons-dbutils:1.8.1"
  implementation 'org.luaj:luaj-jse:3.0.1'

  api "com.badlogicgames.gdx-controllers:gdx-controllers-core:$gdxControllersVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation project(":gdx-video-core")

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }

  testImplementation "junit:junit:4.13.2"
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
