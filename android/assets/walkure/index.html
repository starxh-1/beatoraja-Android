<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Walkure Rating</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#0f1923;color:#d0dce8;padding:16px;overflow-x:hidden;
  -webkit-text-size-adjust:100%
}
.container{max-width:100%;margin:0 auto}
.header{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 0 12px}
.header .title-block{text-align:left}
.header h1{font-size:20px;color:#4fc3f7;margin-bottom:2px}
.header .subtitle{font-size:13px;color:#788a9c}
/* .rating-card removed - now inline styles in render() */
/* slot machine */
@keyframes slotScroll{
  0%{transform:translateY(0)}
  100%{transform:translateY(-10em)}
}
.slot-row{display:inline-flex;align-items:center;vertical-align:middle;height:1em;overflow:visible;user-select:none;-webkit-user-select:none;touch-action:none}
.slot-col{display:inline-block;width:0.7em;height:1em;overflow:hidden;position:relative;vertical-align:top;user-select:none;-webkit-user-select:none}
.slot-col .strip{position:absolute;left:0;top:0;width:100%;will-change:transform;line-height:1}
.slot-col .strip span{display:block;height:1em;text-align:center;font-variant-numeric:tabular-nums}
.slot-dot{display:inline-block;width:0.3em;text-align:center;vertical-align:top;line-height:1}
.slot-col.scrambling .strip{animation-name:slotScroll;animation-timing-function:linear;animation-iteration-count:infinite}

.tabs{display:inline-flex;margin-bottom:12px;border-radius:10px;overflow:hidden;border:1px solid #1e3a5a}
.tab-btn{
  flex:0 0 auto;padding:8px 43px;text-align:center;font-size:14px;font-weight:600;
  background:#1a2a3a;color:#788a9c;border:none;cursor:pointer;
  transition:all .2s
}
.tab-btn.active{background:#1e3a5a;color:#4fc3f7}
.tab-btn:first-child{border-radius:10px 0 0 10px}
.tab-btn:last-child{border-radius:0 10px 10px 0}
.tab-content{display:none}
.tab-content.active{display:block}
.filters{
  background:#1a2a3a;border-radius:10px;padding:12px;margin-bottom:12px;
  font-size:13px;border:1px solid #1e3a5a
}
.filters-title{font-weight:600;color:#4fc3f7;margin-bottom:8px;font-size:14px}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
.filter-row label{color:#788a9c;margin-right:4px}
.filter-row input[type=text]{
  background:#142838;border:1px solid #1e3a5a;border-radius:6px;
  padding:6px 10px;color:#d0dce8;font-size:13px;width:100%;max-width:300px
}
.star-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.star-actions{display:flex;gap:4px;margin-bottom:6px}
.star-actions button{
  background:transparent;border:1px solid rgba(79,195,247,0.2);border-radius:4px;
  color:#4fc3f7;font-size:10px;padding:2px 8px;cursor:pointer
}
.star-group label{
  display:inline-flex;align-items:center;gap:3px;
  background:#142838;border:1px solid #1e3a5a;border-radius:6px;
  padding:4px 8px;font-size:12px;cursor:pointer;color:#788a9c
}
.star-group label.checked{color:#ffe082;border-color:rgba(255,224,130,0.4)}
.lamp-group{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.lamp-group label{
  display:inline-flex;align-items:center;gap:3px;
  background:#142838;border:1px solid #1e3a5a;border-radius:6px;
  padding:4px 8px;font-size:12px;cursor:pointer;color:#788a9c
}
.lamp-group label.checked{border-color:rgba(79,195,247,0.4);color:#4fc3f7}
.filter-actions{display:flex;gap:8px;margin-top:8px}
.filter-actions button{
  background:#142838;border:1px solid #1e3a5a;border-radius:6px;
  padding:4px 12px;color:#4fc3f7;font-size:12px;cursor:pointer
}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
th{background:#142838;color:#4fc3f7;padding:8px 6px;text-align:left;
   position:sticky;top:0;white-space:nowrap;font-weight:600;cursor:pointer;
   user-select:none}
th:hover{background:#1e3a5a}
th .sort-arrow{font-size:10px;margin-left:3px;color:#ffe082}
td{padding:8px 6px;border-bottom:1px solid #1a3048;white-space:nowrap}
tr:nth-child(even) td{background:rgba(20,40,56,0.4)}
.prob-bar{display:inline-block;height:6px;border-radius:3px;min-width:4px}
.chart-name{max-width:180px;overflow-wrap:break-word;white-space:normal}
.lamp-noplay{color:#555}.lamp-failed{color:#e74c3c}
.lamp-easy{color:#1ff00c}
.lamp-normal{color:#ebfc05}
.lamp-hard{color:#f7f3f2}
.lamp-fullCombo,.lamp-fc{color:#1bdbf5}
.empty-msg{text-align:center;padding:30px 16px;color:#788a9c;font-size:14px}
.page-controls{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 0;font-size:13px;color:#788a9c;flex-wrap:wrap;gap:8px
}
.page-controls .page-size-group{display:flex;align-items:center;gap:6px}
.page-controls .page-size-group button{
  background:#142838;border:1px solid #1e3a5a;border-radius:6px;
  padding:4px 10px;color:#4fc3f7;font-size:12px;cursor:pointer
}
.page-controls .page-size-group button.active{background:#1e3a5a;color:#ffe082;border-color:rgba(255,224,130,0.4)}
.page-controls .page-nav{display:flex;align-items:center;gap:6px}
.page-controls .page-nav button{
  background:#142838;border:1px solid #1e3a5a;border-radius:6px;
  padding:4px 10px;color:#4fc3f7;font-size:12px;cursor:pointer
}
.page-controls .page-nav button:disabled{opacity:.3;cursor:default}
.page-controls .page-nav span{min-width:60px;text-align:center}
.close-btn{
  display:table;margin:16px auto 0;padding:10px 32px;
  background:rgba(168,85,247,0.12);color:#4fc3f7;
  border:1px solid rgba(100,100,180,0.3);border-radius:10px;
  font-size:16px;cursor:pointer;text-align:center
}
.loading{text-align:center;padding:60px 16px;color:#788a9c}
.spinner{
  width:36px;height:36px;border:4px solid #1e3a5a;
  border-top-color:#4fc3f7;border-radius:50%;
  animation:spin .8s linear infinite;margin:0 auto 12px
}
@keyframes spin{to{transform:rotate(360deg)}}
.count-badge{font-size:11px;color:#788a9c;margin-left:6px}
.lang-btns{display:flex;gap:2px;flex-shrink:0}
.lang-btn{
  background:transparent;border:1px solid rgba(79,195,247,0.25);border-radius:4px;
  color:#788a9c;font-size:10px;padding:2px 5px;cursor:pointer;transition:all .15s
}
.lang-btn.active{border-color:#4fc3f7;color:#4fc3f7;background:rgba(79,195,247,0.1)}
</style>
</head>
<body>
<div id="app">
<div class="loading"><div class="spinner"></div><p>Loading...</p></div>
</div>
<script>
var _lang='ja'
function _t(k){var l=LANG[_lang]||LANG.ja;return l[k]||k}
var LANG={
  ja:{
    title:'\u30d7\u30ec\u30a4\u30e4\u30fc\u5b9f\u529b',
    recommend:'\u30ea\u30b3\u30e1\u30f3\u30c9',
    revRecommend:'\u9006\u30ea\u30b3\u30e1\u30f3\u30c9',
    filter:'\u30d5\u30a3\u30eb\u30bf',
    songName:'\u66f2\u540d',
    filterBySong:'\u66f2\u540d\u3067\u7d5e\u308a\u8fbc\u307f',
    currentLamp:'\u73fe\u5728\u306e\u30e9\u30f3\u30d7',

    noReverse:'\u9006\u30ea\u30b3\u30e1\u30f3\u30c9\u306f\u3042\u308a\u307e\u305b\u3093\u3002',
    noMatch:'\u30d5\u30a3\u30eb\u30bf\u306b\u4e00\u81f4\u3059\u308b\u304c\u3042\u308a\u307e\u305b\u3093\u3002',
    noRec:'No recommendations found.',
    lamp:'\u30e9\u30f3\u30d7',
    diff:'\u96e3\u5ea6',
    ground:'\u5730\u529b\u8b5c\u9762\u5ea6',
    recDeg:'\u30ea\u30b3\u30e1\u30f3\u5ea6'
  },
  en:{
    title:'Player Rating',
    recommend:'Recommend',
    revRecommend:'Reverse Recommend',
    filter:'Filters',
    songName:'Title',
    filterBySong:'Filter by title',
    currentLamp:'Current Lamp',
    target:'Target',
    reset:'Reset',
    perPage:'Per page',
    prev:'Prev',
    next:'Next',
    items:'items',
    close:'Close',
    loading:'Loading...',
    noReverse:'No reverse recommendations.',
    noMatch:'No charts match the filters.',
    noRec:'No recommendations found.',
    lamp:'Lamp',
    diff:'Difficulty',
    ground:'Chart Difficulty',
    recDeg:'Recommendation'
  },
  zh:{
    title:'\u73a9\u5bb6\u5b9e\u529b',
    recommend:'\u63a8\u8350',
    revRecommend:'\u9006\u63a8\u8350',
    filter:'\u7b5b\u9009',
    songName:'\u66f2\u540d',
    filterBySong:'\u6309\u66f2\u540d\u7b5b\u9009',
    currentLamp:'\u5f53\u524d\u706f',
    target:'\u76ee\u6807',
    reset:'\u91cd\u7f6e',
    perPage:'\u6bcf\u9875\u663e\u793a',
    prev:'\u4e0a\u4e00\u9875',
    next:'\u4e0b\u4e00\u9875',
    items:'\u6761',
    close:'\u5173\u95ed',
    loading:'\u52a0\u8f7d\u4e2d...',
    noReverse:'\u6ca1\u6709\u9006\u63a8\u8350\u3002',
    noMatch:'\u6ca1\u6709\u7b26\u5408\u6761\u4ef6\u7684\u8c31\u9762\u3002',
    noRec:'\u6ca1\u6709\u63a8\u8350\u3002',
    lamp:'\u706f',
    diff:'\u96be\u5ea6',
    ground:'\u5730\u529b\u8c31\u9762\u5ea6',
    recDeg:'\u63a8\u8350\u5ea6'
  },
  ko:{
    title:'\ud50c\ub808\uc774\uc5b4 \uc2e4\ub825',
    recommend:'\ucd94\ucc9c',
    revRecommend:'\uc5ed\ucd94\ucc9c',
    filter:'\ud544\ud130',
    songName:'\uace1\uba85',
    filterBySong:'\uace1\uba85\uc73c\ub85c \uac80\uc0c9',
    currentLamp:'\ud604\uc7ac \ub7a8\ud504',
    target:'\ubaa9\ud45c',
    reset:'\ucd08\uae30\ud654',
    perPage:'\ud45c\uc2dc \uac74\uc218',
    prev:'\uc774\uc804',
    next:'\ub2e4\uc74c',
    items:'\uac74',
    close:'\ub2eb\uae30',
    loading:'\ub85c\ub529 \uc911...',
    noReverse:'\uc5ed\ucd94\ucc9c\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.',
    noMatch:'\ud544\ud130\uc5d0 \uc77c\uce58\ud558\ub294 \uace1\uc774 \uc5c6\uc2b5\ub2c8\ub2e4.',
    noRec:'\ucd94\ucc9c \uacb0\uacfc\uac00 \uc5c6\uc2b5\ub2c8\ub2e4.',
    lamp:'\ub7a8\ud504',
    diff:'\ub09c\uc774\ub3c4',
    ground:'\ucc28\ud2b8 \ub09c\uc774\ub3c4',
    recDeg:'\ucd94\ucc9c\ub3c4'
  }
}
var RatingApp={
  data:null,
  recSortCol:4,
  recSortDir:-1,
  revSortCol:5,
  revSortDir:1,
  recPageSize:25,
  revPageSize:25,
  recPage:0,
  revPage:0,
  showRating:function(d){
    if(typeof d==='string'){try{this.data=JSON.parse(d)}catch(e){this.renderError("Invalid data");return}}
    else{this.data=d}
    this.recPage=0;this.revPage=0
    this.render()
  },
  render:function(){
    var d=this.data
    if(!d){this.renderLoading();return}
    if(d.error){this.renderError(d.error);return}
    var h='<div class="container">'
    h+='<div class="header">'
    h+='<div class="title-block"><h1>'+_t('title')+'</h1>'
    if(d.playerName)h+='<div class="subtitle">'+this.esc(d.playerName)+'</div>'
    h+='</div>'
    h+='<div class="lang-btns">'
    var l=['ja','en','zh','ko'],ln=['\u65e5\u672c\u8a9e','English','\u4e2d\u6587','\ud55c\uad6d\uc5b4']
    for(var i=0;i<l.length;i++)h+='<button onclick="RatingApp.switchLang(\''+l[i]+'\')" class="lang-btn'+(l[i]===_lang?' active':'')+'">'+ln[i]+'</button>'
    h+='</div>'
    h+='</div>'
    h+='<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin:16px 0">'
    h+='<span style="font-size:34px;color:#ffe082">\u2605</span>'
    h+='<span id="star-slot" style="font-size:34px;font-weight:bold;color:#ffe082;font-variant-numeric:tabular-nums"></span>'
    h+='</div>'
    h+='<div class="tabs">'
    h+='<button class="tab-btn active" onclick="RatingApp.switchTab(0)">'+_t('recommend')+'</button>'
    h+='<button class="tab-btn" onclick="RatingApp.switchTab(1)">'+_t('revRecommend')+'</button>'
    h+='</div>'
    h+='<div id="tab0" class="tab-content active"></div>'
    h+='<div id="tab1" class="tab-content"></div>'
    h+='<button class="close-btn" onclick="RatingApp.close()">Close</button></div>'
    document.getElementById('app').innerHTML=h
    this.updateStarSlot(d.playerStarRating)
    this.renderRecTab()
    this.renderRevTab()
  },
  switchLang:function(l){
    _lang=l
    var saved;var el=document.getElementById('star-slot');if(el)saved=el.innerHTML
    this.render()
    if(saved){var el2=document.getElementById('star-slot');if(el2)el2.innerHTML=saved}
  },
  switchTab:function(idx){
    var btns=document.querySelectorAll('.tab-btn')
    var cts=document.querySelectorAll('.tab-content')
    for(var i=0;i<btns.length;i++){
      btns[i].className='tab-btn'+(i===idx?' active':'')
      cts[i].className='tab-content'+(i===idx?' active':'')
    }
  },
  formatStar:function(levels){
    if(!levels)return'\u2605?'
    var parts=[]
    if(levels.insane){
      if(levels.insane==='???')parts.push('???')
      else parts.push('\u2605'+levels.insane)
    }
    if(levels.overjoy)parts.push('\u2605\u2605'+levels.overjoy)
    if(levels.dan)parts.push('\u6bb5\u4f4d')
    if(parts.length)return parts.join(', ')
    return'\u2605?'
  },
  starNum:function(s){
    if(!s||s==='?')return -1
    if(s==='???')return 0
    var parts=s.split(',').map(function(x){return x.trim()})
    var max=-1
    for(var i=0;i<parts.length;i++){
      var p=parts[i]
      var n
      if(p.indexOf('\u2605\u2605')===0)n=100+(parseInt(p.slice(2))||0)
      else if(p.indexOf('\u2605')===0)n=parseInt(p.slice(1))||0
      else if(p.indexOf('\u6bb5\u4f4d')===0)n=200+(parseInt(p.slice(2))||0)
      else continue
      if(n>max)max=n
    }
    return max
  },
  lampNum:function(l){
    var m={noplay:0,failed:1,easy:2,normal:3,hard:4,'fullCombo':5}
    return m[l]!==void 0?m[l]:-1
  },
  ALL_STARS:(function(){
    var a=[]
    for(var i=1;i<=25;i++)a.push('\u2605'+i)
    for(var i=0;i<=8;i++)a.push('\u2605\u2605'+i)
    a.push('\u6bb5\u4f4d')
    a.push('???')
    return a
  })(),
  ALL_OLD_LAMPS:['noplay','failed','easy','normal','hard','fullCombo'],
  ALL_NEW_LAMPS:['easy','normal','hard','fullCombo'],
  renderRecTab:function(){
    var d=this.data
    if(!d||!d.recommendation||!d.recommendation.length){document.getElementById('tab0').innerHTML='<div class="empty-msg">'+_t('noRec')+'</div>';return}
    var tab=document.getElementById('tab0')
    tab.innerHTML=''
    var filters=document.createElement('div')
    filters.className='filters'
    filters.innerHTML='<div class="filters-title">'+_t('filter')+'</div>'+
      '<div class="filter-row"><label>\u2605:</label></div><div class="star-group" id="rec-star-filter"></div><div class="star-actions"><button onclick="RatingApp.toggleStarGroup(\'rec-star-filter\',true)">All</button><button onclick="RatingApp.toggleStarGroup(\'rec-star-filter\',false)">None</button></div>'+
      '<div class="filter-row"><label>'+_t('currentLamp')+':</label></div><div class="lamp-group" id="rec-old-lamp-filter"></div>'+
      '<div class="filter-row"><label>'+_t('target')+':</label></div><div class="lamp-group" id="rec-new-lamp-filter"></div>'+
      '<div class="filter-actions"><button onclick="RatingApp.resetRecFilters()">'+_t('reset')+'</button></div>'
    tab.appendChild(filters)
    var area=document.createElement('div')
    area.id='rec-area'
    tab.appendChild(area)
    this.buildCheckboxes('rec-star-filter',this.ALL_STARS,'rec-star')
    this.buildCheckboxes('rec-old-lamp-filter',this.ALL_OLD_LAMPS,'rec-old-lamp')
    this.buildCheckboxes('rec-new-lamp-filter',this.ALL_NEW_LAMPS,'rec-new-lamp')
    this.rerenderRecTable()
  },
  renderRevTab:function(){
    var d=this.data
    if(!d||!d.reverseRecommendation||!d.reverseRecommendation.length){document.getElementById('tab1').innerHTML='<div class="empty-msg">'+_t('noReverse')+'</div>';return}
    var tab=document.getElementById('tab1')
    tab.innerHTML=''
    var filters=document.createElement('div')
    filters.className='filters'
    filters.innerHTML='<div class="filters-title">'+_t('filter')+'</div>'+
      '<div class="filter-row"><label>\u2605:</label></div><div class="star-group" id="rev-star-filter"></div><div class="star-actions"><button onclick="RatingApp.toggleStarGroup(\'rev-star-filter\',true)">All</button><button onclick="RatingApp.toggleStarGroup(\'rev-star-filter\',false)">None</button></div>'+
      '<div class="filter-row"><label>'+_t('lamp')+':</label></div><div class="lamp-group" id="rev-lamp-filter"></div>'+
      '<div class="filter-row"><label>'+_t('ground')+':</label><input type="text" id="rev-ground-filter" placeholder="min" style="background:#142838;border:1px solid #1e3a5a;border-radius:6px;padding:4px 8px;color:#d0dce8;font-size:12px;width:80px"></div>'+
      '<div class="filter-actions"><button onclick="RatingApp.resetRevFilters()">'+_t('reset')+'</button></div>'
    tab.appendChild(filters)
    var area=document.createElement('div')
    area.id='rev-area'
    tab.appendChild(area)
    this.buildCheckboxes('rev-star-filter',this.ALL_STARS,'rev-star')
    this.buildCheckboxes('rev-lamp-filter',['easy','normal','hard','fullCombo'],'rev-lamp')
    var self=this
    var groundEl=document.getElementById('rev-ground-filter')
    if(groundEl)groundEl.addEventListener('input',function(){self.revPage=0;self.rerenderRevTable()})
    this.rerenderRevTable()
  },
  rerenderRecTable:function(){
    var area=document.getElementById('rec-area')
    if(!area)return
    var result=this.getRecData()
    area.innerHTML=this.buildRecTable(result)+this.buildRecPageInfo(result)
  },
  rerenderRevTable:function(){
    var area=document.getElementById('rev-area')
    if(!area)return
    var result=this.getRevData()
    area.innerHTML=this.buildRevTable(result)+this.buildRevPageInfo(result)
  },
  getFilteredRec:function(){
    var arr=this.data.recommendation.slice()
    // dan charts have no easy clear — skip entries with target="easy"
    arr=arr.filter(function(r){
      if(r.difficultyTableLevels&&r.difficultyTableLevels.dan&&r.targetClearLamp==='easy')return false
      return true
    })
    var stars=this.getCheckedSet('rec-star-filter')
    var oldLamps=this.getCheckedSet('rec-old-lamp-filter')
    var newLamps=this.getCheckedSet('rec-new-lamp-filter')
    return arr.filter(function(r){
      if(!RatingApp.matchStarFilter(r.difficultyTableLevels,stars))return false
      if(oldLamps.size&&!oldLamps.has(r.currentClearLamp))return false
      if(newLamps.size&&!newLamps.has(r.targetClearLamp))return false
      return true
    })
  },
  getFilteredRev:function(){
    var arr=this.data.reverseRecommendation.slice()
    var stars=this.getCheckedSet('rev-star-filter')
    var lamps=this.getCheckedSet('rev-lamp-filter')
    var groundEl=document.getElementById('rev-ground-filter')
    var groundMin=groundEl&&groundEl.value?parseFloat(groundEl.value):NaN
    return arr.filter(function(r){
      if(!RatingApp.matchStarFilter(r.difficultyTableLevels,stars))return false
      if(lamps.size&&!lamps.has(r.clearLamp))return false
      if(!isNaN(groundMin)&&(r.chartDiscrimination==null||r.chartDiscrimination<groundMin))return false
      return true
    })
  },
  matchStarFilter:function(levels,checkedSet){
    if(!checkedSet||!checkedSet.size)return true
    var s=RatingApp.formatStar(levels)
    if(checkedSet.has(s))return true
    var parts=s.split(',').map(function(x){return x.trim()})
    for(var i=0;i<parts.length;i++){
      if(checkedSet.has(parts[i]))return true
      if(checkedSet.has('\u6bb5\u4f4d')&&parts[i].indexOf('\u6bb5\u4f4d')===0)return true
    }
    return false
  },
  getRecData:function(){
    var arr=this.getFilteredRec()
    if(this.recSortCol>=0){
      var col=this.recSortCol,dir=this.recSortDir
      arr.sort(function(a,b){
        var va,vb
        switch(col){
          case 0:va=RatingApp.starNum(RatingApp.formatStar(a.difficultyTableLevels));vb=RatingApp.starNum(RatingApp.formatStar(b.difficultyTableLevels));break
          case 1:va=a.name.toLowerCase();vb=b.name.toLowerCase();break
          case 2:va=RatingApp.lampNum(a.currentClearLamp);vb=RatingApp.lampNum(b.currentClearLamp);break
          case 3:va=RatingApp.lampNum(a.targetClearLamp);vb=RatingApp.lampNum(b.targetClearLamp);break
          case 4:va=a.prob;vb=b.prob;break
          default:return 0
        }
        if(va<vb)return -dir
        if(va>vb)return dir
        return 0
      })
    }
    var total=arr.length
    var limit=this.recPageSize
    var page=this.recPage
    if(limit===0)return{rows:arr,total:total,page:0,npages:1}
    var npages=Math.ceil(total/limit)||1
    if(page>=npages)page=npages-1
    if(page<0)page=0
    this.recPage=page
    var start=page*limit
    var rows=arr.slice(start,start+limit)
    return{rows:rows,total:total,page:page,npages:npages}
  },
  getRevData:function(){
    var arr=this.getFilteredRev()
    if(this.revSortCol>=0){
      var col=this.revSortCol,dir=this.revSortDir
      arr.sort(function(a,b){
        var va,vb
        switch(col){
          case 0:va=RatingApp.starNum(RatingApp.formatStar(a.difficultyTableLevels));vb=RatingApp.starNum(RatingApp.formatStar(b.difficultyTableLevels));break
          case 1:va=a.name.toLowerCase();vb=b.name.toLowerCase();break
          case 2:va=RatingApp.lampNum(a.clearLamp);vb=RatingApp.lampNum(b.clearLamp);break
          case 3:va=a.clearDifficultyStarRating!=null?a.clearDifficultyStarRating:0;vb=b.clearDifficultyStarRating!=null?b.clearDifficultyStarRating:0;break
          case 4:va=a.chartDiscrimination||0;vb=b.chartDiscrimination||0;break
          case 5:va=a.prob;vb=b.prob;break
          default:return 0
        }
        if(va<vb)return -dir
        if(va>vb)return dir
        return 0
      })
    }
    var total=arr.length
    var limit=this.revPageSize
    var page=this.revPage
    if(limit===0)return{rows:arr,total:total,page:0,npages:1}
    var npages=Math.ceil(total/limit)||1
    if(page>=npages)page=npages-1
    if(page<0)page=0
    this.revPage=page
    var start=page*limit
    var rows=arr.slice(start,start+limit)
    return{rows:rows,total:total,page:page,npages:npages}
  },
  buildRecTable:function(result){
    var rows=result.rows
    if(!rows.length)return'<div class="empty-msg">'+_t('noMatch')+'</div>'
var h='<div class="table-wrap"><table id="rec-table"><thead><tr>'
    h+='<th style="width:36px" onclick="RatingApp.sortRec(0)">\u2605<span class="sort-arrow">'+this.sortArrow(0,this.recSortCol,this.recSortDir)+'</span></th>'
    h+='<th onclick="RatingApp.sortRec(1)">Title<span class="sort-arrow">'+this.sortArrow(1,this.recSortCol,this.recSortDir)+'</span></th>'
    h+='<th style="width:90px" onclick="RatingApp.sortRec(2)">Current<span class="sort-arrow">'+this.sortArrow(2,this.recSortCol,this.recSortDir)+'</span></th>'
    h+='<th style="width:90px" onclick="RatingApp.sortRec(3)">Target<span class="sort-arrow">'+this.sortArrow(3,this.recSortCol,this.recSortDir)+'</span></th>'
    h+='<th style="width:150px" onclick="RatingApp.sortRec(4)">'+_t('recDeg')+'<span class="sort-arrow">'+this.sortArrow(4,this.recSortCol,this.recSortDir)+'</span></th>'
    h+='</tr></thead><tbody>'
    for(var i=0;i<rows.length;i++){
      var r=rows[i]
      var star=this.formatStar(r.difficultyTableLevels)
      var curLamp=r.currentClearLamp?r.currentClearLamp.toUpperCase():''
      var tgtLamp=r.targetClearLamp?r.targetClearLamp.toUpperCase():''
      var curCls=r.currentClearLamp?'lamp-'+r.currentClearLamp:''
      var tgtCls=r.targetClearLamp?'lamp-'+r.targetClearLamp:''
      h+='<tr>'
      h+='<td>'+star+'</td>'
      h+='<td class="chart-name" title="'+this.esc(r.name)+'">'+this.esc(r.name)+'</td>'
      h+='<td class="'+curCls+'">'+curLamp+'</td>'
      h+='<td class="'+tgtCls+'">'+tgtLamp+'</td>'
      h+='<td>'+this.probCell(r.prob)+'</td>'
      h+='</tr>'
    }
    h+='</tbody></table></div>'
    return h
  },
  buildRevTable:function(result){
    var rows=result.rows
    if(!rows.length)return'<div class="empty-msg">'+_t('noMatch')+'</div>'
var h='<div class="table-wrap"><table id="rev-table"><thead><tr>'
    h+='<th style="width:36px" onclick="RatingApp.sortRev(0)">\u2605<span class="sort-arrow">'+this.sortArrow(0,this.revSortCol,this.revSortDir)+'</span></th>'
    h+='<th onclick="RatingApp.sortRev(1)">Title<span class="sort-arrow">'+this.sortArrow(1,this.revSortCol,this.revSortDir)+'</span></th>'
    h+='<th style="width:90px" onclick="RatingApp.sortRev(2)">Lamp<span class="sort-arrow">'+this.sortArrow(2,this.revSortCol,this.revSortDir)+'</span></th>'
    h+='<th style="width:80px" onclick="RatingApp.sortRev(3)">'+_t('diff')+'<span class="sort-arrow">'+this.sortArrow(3,this.revSortCol,this.revSortDir)+'</span></th>'
    h+='<th style="width:80px" onclick="RatingApp.sortRev(4)">'+_t('ground')+'<span class="sort-arrow">'+this.sortArrow(4,this.revSortCol,this.revSortDir)+'</span></th>'
    h+='<th style="width:150px" onclick="RatingApp.sortRev(5)">'+_t('recDeg')+'<span class="sort-arrow">'+this.sortArrow(5,this.revSortCol,this.revSortDir)+'</span></th>'
    h+='</tr></thead><tbody>'
    for(var i=0;i<rows.length;i++){
      var r=rows[i]
      var star=this.formatStar(r.difficultyTableLevels)
      var lampVal=r.clearLamp?r.clearLamp.toUpperCase():''
      var lampCls=r.clearLamp?'lamp-'+r.clearLamp:''
      var diffStar=r.clearDifficultyStarRating!=null?'\u2605'+r.clearDifficultyStarRating.toFixed(2):'-'
      h+='<tr>'
      h+='<td>'+star+'</td>'
      h+='<td class="chart-name" title="'+this.esc(r.name)+'">'+this.esc(r.name)+'</td>'
      h+='<td class="'+lampCls+'">'+lampVal+'</td>'
      h+='<td>'+diffStar+'</td>'
      h+='<td>'+r.chartDiscrimination.toFixed(3)+'</td>'
      h+='<td>'+this.probCell(r.prob)+'</td>'
      h+='</tr>'
    }
    h+='</tbody></table></div>'
    return h
  },
  buildRecPageInfo:function(result){
    return this.buildPageInfo(result,'rec')
  },
  buildRevPageInfo:function(result){
    return this.buildPageInfo(result,'rev')
  },
  buildPageInfo:function(result,prefix){
    var h='<div class="page-controls">'
    h+='<div class="page-size-group">'+_t('perPage')+': '
    h+='<button onclick="RatingApp.setPageSize(\''+prefix+'\',25)"'+(prefix==='rec'?this.recPageSize===25?' class="active"':'':this.revPageSize===25?' class="active"':'')+'>25</button>'
    h+='<button onclick="RatingApp.setPageSize(\''+prefix+'\',50)"'+(prefix==='rec'?this.recPageSize===50?' class="active"':'':this.revPageSize===50?' class="active"':'')+'>50</button>'
    h+='<button onclick="RatingApp.setPageSize(\''+prefix+'\',0)"'+(prefix==='rec'?this.recPageSize===0?' class="active"':'':this.revPageSize===0?' class="active"':'')+'>Full</button>'
    h+='</div>'
    h+='<div class="page-nav">'
    h+='<button onclick="RatingApp.pageNav(\''+prefix+'\',-1)"'+(result.page<=0?' disabled':'')+'>'+_t('prev')+'</button>'
    h+='<span>'+(result.npages>0?(result.page+1)+'/'+result.npages:'0/0')+'</span>'
    h+='<button onclick="RatingApp.pageNav(\''+prefix+'\',1)"'+(result.page>=result.npages-1?' disabled':'')+'>'+_t('next')+'</button>'
    h+='</div>'
    h+='<span>'+result.total+_t('items')+'</span>'
    h+='</div>'
    return h
  },
  sortArrow:function(col,sortCol,sortDir){
    if(col!==sortCol)return''
    return sortDir>0?'\u25b2':'\u25bc'
  },
  sortRec:function(col){
    if(this.recSortCol===col){this.recSortDir=-this.recSortDir}else{this.recSortCol=col;this.recSortDir=1}
    this.recPage=0
    this.rerenderRecTable()
  },
  sortRev:function(col){
    if(this.revSortCol===col){this.revSortDir=-this.revSortDir}else{this.revSortCol=col;this.revSortDir=1}
    this.revPage=0
    this.rerenderRevTable()
  },
  setPageSize:function(prefix,size){
    if(prefix==='rec'){this.recPageSize=size;this.recPage=0;this.rerenderRecTable()}else{this.revPageSize=size;this.revPage=0;this.rerenderRevTable()}
  },
  pageNav:function(prefix,delta){
    if(prefix==='rec'){this.recPage=Math.max(0,Math.min(this.recPage+delta,Math.ceil(this.getFilteredRec().length/this.recPageSize)-1));this.rerenderRecTable()}
    else{this.revPage=Math.max(0,Math.min(this.revPage+delta,Math.ceil(this.getFilteredRev().length/this.revPageSize)-1));this.rerenderRevTable()}
  },
  getCheckedSet:function(id){
    var c=document.getElementById(id)
    if(!c)return new Set()
    var s=new Set()
    var cbs=c.querySelectorAll('input[type=checkbox]:checked')
    for(var i=0;i<cbs.length;i++)s.add(cbs[i].value)
    return s
  },
  buildCheckboxes:function(containerId,items,group){
    var c=document.getElementById(containerId)
    if(!c)return
    c.innerHTML=''
    var self=this
    var isLamp=group.indexOf('lamp')>=0
    for(var i=0;i<items.length;i++){
      var lbl=document.createElement('label')
      var cb=document.createElement('input')
      cb.type='checkbox'
      cb.value=items[i]
      cb.checked=true
      cb.dataset.group=group
      cb.addEventListener('change',function(){
        this.parentNode.className=this.checked?'checked':''
        self.onFilterChange(this.dataset.group)
      })
      lbl.appendChild(cb)
      lbl.appendChild(document.createTextNode(' '+(isLamp?items[i].toUpperCase():items[i])))
      lbl.className='checked'
      c.appendChild(lbl)
    }
  },
  onFilterChange:function(group){
    if(group==='rec-star'||group==='rec-old-lamp'||group==='rec-new-lamp'){this.recPage=0;this.rerenderRecTable()}
    else if(group==='rev-star'||group==='rev-lamp'){this.revPage=0;this.rerenderRevTable()}
  },
  resetRecFilters:function(){
    var containers=['rec-star-filter','rec-old-lamp-filter','rec-new-lamp-filter']
    for(var i=0;i<containers.length;i++){
      var el=document.getElementById(containers[i])
      if(!el)continue
      var cbs=el.querySelectorAll('input[type=checkbox]')
      for(var j=0;j<cbs.length;j++){cbs[j].checked=true;cbs[j].parentNode.className='checked'}
    }
    this.recPage=0
    this.rerenderRecTable()
  },
  resetRevFilters:function(){
    var containers=['rev-star-filter','rev-lamp-filter']
    for(var i=0;i<containers.length;i++){
      var el=document.getElementById(containers[i])
      if(!el)continue
      var cbs=el.querySelectorAll('input[type=checkbox]')
      for(var j=0;j<cbs.length;j++){cbs[j].checked=true;cbs[j].parentNode.className='checked'}
    }
    var groundEl=document.getElementById('rev-ground-filter')
    if(groundEl)groundEl.value=''
    this.revPage=0
    this.rerenderRevTable()
  },
  toggleStarGroup:function(id,check){
    var el=document.getElementById(id)
    if(!el)return
    var cbs=el.querySelectorAll('input[type=checkbox]')
    for(var j=0;j<cbs.length;j++){cbs[j].checked=check;cbs[j].parentNode.className=check?'checked':''}
  },
  probCell:function(p){
    var pc=(p*100).toFixed(1)
    var hue=Math.round(120*p)
    var bg='hsl('+hue+',70%,35%)'
    return'<div class="prob-bar" style="width:'+(p*100)+'%;background:'+bg+'"></div> '+pc+'%'
  },
  // ── Slot machine star rating ──
  _SLOT_COPIES:5,
  _SLOT_START:2,
  _SLOT_SPINS:2,
  updateStarSlot:function(v){
    if(v==null){var e=document.getElementById('star-slot');if(e)e.textContent='?';return}
    var p=0
    if(window.RatingBridge&&window.RatingBridge.getPrevStarRating)p=window.RatingBridge.getPrevStarRating()
    var e=document.getElementById('star-slot');if(!e)return
    var refStr=v.toFixed(2),html='<span class="slot-row">'
    for(var i=0;i<refStr.length;i++){
      var c=refStr[i]
      if(c=='.'){html+='<span class="slot-dot">.</span>'}else{
        html+='<span class="slot-col"><span class="strip">'
        for(var r=0;r<this._SLOT_COPIES;r++){for(var d=0;d<=9;d++)html+='<span>'+d+'</span>'}
        html+='</span></span>'
      }
    }
    html+='</span>'
    e.innerHTML=html
    this._setSlotPos(e,this._formatMatch(p,refStr),false)
    var self=this
    requestAnimationFrame(function(){requestAnimationFrame(function(){self._setSlotPos(e,refStr,true)})})
    if(window.RatingBridge&&window.RatingBridge.saveStarRating)window.RatingBridge.saveStarRating(v)
    // long-press scramble
    var row=e.querySelector('.slot-row')
    if(row){
      row._pressTimer=null
      row._targetVal=refStr
      var cols=row.querySelectorAll('.slot-col')
      var speeds=[0.4,0.5,0.6]
      var startScramble=function(){
        for(var i=0;i<cols.length;i++){
          var strip=cols[i].querySelector('.strip')
          strip.style.animation=''
          strip.style.transition=''
          strip.style.transform=''
          cols[i].classList.add('scrambling')
          strip.style.animationDuration=speeds[i%speeds.length]+'s'
        }
      }
      var stopScramble=function(){
        if(row._pressTimer){clearTimeout(row._pressTimer);row._pressTimer=null}
        // read animated position BEFORE removing the animation class
        var positions=[]
        for(var i=0;i<cols.length;i++){
          var strip=cols[i].querySelector('.strip')
          var matrix=getComputedStyle(strip).transform
          var ty=0
          if(matrix&&matrix!=='none'){
            var m2d=matrix.match(/matrix\(([^)]+)\)/)
            if(m2d){var p=m2d[1].split(',');ty=parseFloat(p[5])||0}
            else{
              var m3d=matrix.match(/matrix3d\(([^)]+)\)/)
              if(m3d){var p3=m3d[1].split(',');ty=parseFloat(p3[13])||0}
            }
          }
          // snap to nearest digit boundary (each digit = 1em = fontSize px)
          var fs=parseFloat(getComputedStyle(strip).fontSize)||34
          ty=Math.round(ty/fs)*fs
          positions.push(ty)
        }
        // freeze each strip at its current visual position
        for(var i=0;i<cols.length;i++){
          var strip=cols[i].querySelector('.strip')
          cols[i].classList.remove('scrambling')
          strip.style.animation='none'
          strip.style.transition='none'
          strip.style.transform='translateY('+positions[i]+'px)'
        }
        // force reflow then slide back after 0.5s
        row.offsetHeight
        setTimeout(function(){self._setSlotPos(e,row._targetVal,true)},500)
      }
      row.addEventListener('touchstart',function(){
        row._pressTimer=setTimeout(startScramble,500)
      },{passive:true})
      row.addEventListener('touchend',stopScramble)
      row.addEventListener('touchcancel',stopScramble)
      row.addEventListener('mousedown',function(){
        row._pressTimer=setTimeout(startScramble,500)
      })
      row.addEventListener('mouseup',stopScramble)
      row.addEventListener('mouseleave',stopScramble)
    }
  },
  _formatMatch:function(val,refStr){
    var rp=refStr.split('.'),vp=val.toFixed(rp[1].length).split('.')
    while(vp[0].length<rp[0].length)vp[0]='0'+vp[0]
    if(vp[0].length>rp[0].length)vp[0]=vp[0].slice(-rp[0].length)
    return vp[0]+'.'+vp[1]
  },
  _setSlotPos:function(el,str,anim){
    var cols=el.querySelectorAll('.slot-col'),idx=0
    for(var i=0;i<str.length;i++){
      if(str[i]=='.')continue
      var t=parseInt(str[i]),col=cols[idx];if(!col)break
      var st=col.querySelector('.strip')
      if(anim){
        st.style.transition='transform 0.5s cubic-bezier(0.15,0.85,0.35,1) '+(idx*0.07+0.1)+'s'
        st.style.transform='translateY(-'+((this._SLOT_START*10+t)+this._SLOT_SPINS*10)+'em)'
      }else{
        st.style.transition='none'
        st.style.transform='translateY(-'+(this._SLOT_START*10+t)+'em)'
      }
      idx++
    }
  },
  renderLoading:function(){
    document.getElementById('app').innerHTML='<div class="loading"><div class="spinner"></div><p>Loading...</p></div>'
  },
  renderError:function(msg){
    document.getElementById('app').innerHTML='<div class="container"><div style="text-align:center;padding:40px 16px;color:#e74c3c"><div style="font-size:48px;margin-bottom:12px">!</div><p>'+this.esc(msg)+'</p></div><button class="close-btn" onclick="RatingApp.close()">Close</button></div>'
  },
  close:function(){
    if(window.RatingBridge){window.RatingBridge.close()}
  },
  esc:function(s){
    if(s==null)return''
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  }
}
</script>
